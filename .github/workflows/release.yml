name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push'
        continue-on-error: true
        run: node ./scripts/report-first-publish.mjs
      - if: github.event_name == 'workflow_dispatch'
        run: node ./scripts/verify-prerelease-versions.mjs
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm release:next
      - if: github.event_name == 'workflow_dispatch'
        run: git push origin --tags
      - name: Validate release App configuration
        id: validate-release-app
        if: github.event_name == 'push'
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=()
          if [[ -z "${RELEASE_APP_CLIENT_ID}" ]]; then
            missing+=("RELEASE_APP_CLIENT_ID")
          fi
          if [[ -z "${RELEASE_APP_PRIVATE_KEY}" ]]; then
            missing+=("RELEASE_APP_PRIVATE_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release GitHub App configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Create release App token
        id: release-app-token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@v2
        if: github.event_name == 'push'
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          version-script: pnpm version:packages
          publish-script: pnpm release
          push-git-tags: true
          create-github-releases: true
