name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation-only:
        description: Run full validation without publishing or changing tags
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || inputs.validation-only
    runs-on: ubuntu-latest
    environment: npm
    env:
      FORGE_CHECK_TEST_WORKERS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: pnpm
      - name: Record runner resources
        run: |
          node --input-type=module -e '
            import { availableParallelism, cpus, freemem, totalmem } from "node:os";
            import { statfsSync } from "node:fs";
            const disk = statfsSync(".", { bigint: true });
            console.log(JSON.stringify({ node: process.version, cpus: cpus().length,
              availableParallelism: availableParallelism(), totalMemory: totalmem(), freeMemory: freemem(),
              freeDisk: String(disk.bavail * disk.bsize), workers: process.env.FORGE_CHECK_TEST_WORKERS }));
          '
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push'
        continue-on-error: true
        run: node ./scripts/report-first-publish.mjs
      - name: Validate release without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.validation-only
        run: |
          pnpm check:full
          pnpm check
          pnpm exec node --input-type=module -e 'import { assertFullCheckReceipt } from "./scripts/check-release-gate.mjs"; await assertFullCheckReceipt(process.cwd());'
      - if: github.event_name == 'workflow_dispatch' && !inputs.validation-only
        run: node ./scripts/verify-prerelease-versions.mjs
      - if: github.event_name == 'workflow_dispatch' && !inputs.validation-only
        run: pnpm release:next
      - if: github.event_name == 'workflow_dispatch' && !inputs.validation-only
        run: git push origin --tags
      - name: Validate release App configuration
        id: validate-release-app
        if: github.event_name == 'push'
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=()
          if [[ -z "${RELEASE_APP_CLIENT_ID}" ]]; then
            missing+=("RELEASE_APP_CLIENT_ID")
          fi
          if [[ -z "${RELEASE_APP_PRIVATE_KEY}" ]]; then
            missing+=("RELEASE_APP_PRIVATE_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release GitHub App configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Create release App token
        id: release-app-token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@v2
        if: github.event_name == 'push'
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          version-script: pnpm version:packages
          publish-script: pnpm release
          push-git-tags: true
          create-github-releases: true
