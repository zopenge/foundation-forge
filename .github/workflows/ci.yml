name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    env:
      # 仓库入口按共享预算派生 Vitest 子进程；Windows 的单槽约束必须从根预算生效。
      FORGE_CHECK_TEST_WORKERS: ${{ matrix.os == 'windows-2025' && '1' || '2' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        node-version:
          - 22
          - 24
          - 26
        include:
          - os: windows-2025
            node-version: 24
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:full
