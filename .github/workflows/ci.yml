name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    env:
      FORGE_CHECK_TEST_WORKERS: '2'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        node-version:
          - 24
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:full

  verify-windows:
    name: windows-2025 / Node.js 24 / shard ${{ matrix.shard }}
    runs-on: windows-2025
    env:
      # 每台Windows仍从根预算维持单worker；全部片成功后必须汇总。
      FORGE_CHECK_TEST_WORKERS: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        with:
          name: windows-coverage-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .tmp/ci-shards/part-${{ matrix.shard }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  merge-windows:
    name: windows-2025 / Node.js 24 / complete coverage
    needs: verify-windows
    runs-on: windows-2025
    env:
      FORGE_CHECK_TEST_WORKERS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v8
        with:
          name: windows-coverage-1-${{ github.run_attempt }}
          path: .tmp/ci-shards/part-1
      - uses: actions/download-artifact@v8
        with:
          name: windows-coverage-2-${{ github.run_attempt }}
          path: .tmp/ci-shards/part-2
      - run: pnpm check:ci --merge .tmp/ci-shards
